<svg width="680" viewBox="0 0 680 505" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <title>mcp_example 코드 구조 — MCP Host / Client / Server</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="505" fill="#FFFFFF"/>

  <!-- ===== Host container ===== -->
  <rect x="40" y="64" width="300" height="372" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="58" y="92" font-size="15" font-weight="600" fill="#1E293B">MCP Host</text>
  <text x="58" y="110" font-size="12" fill="#64748B">mcp_host.py</text>

  <!-- User -->
  <rect x="60" y="126" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
  <text x="78" y="150" font-size="14" font-weight="600" fill="#2C2C2A">① 사용자</text>
  <text x="78" y="169" font-size="12" fill="#5F5E5A">질문 입력 (터미널)</text>

  <!-- LLM -->
  <rect x="60" y="210" width="260" height="72" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1.2"/>
  <text x="78" y="236" font-size="14" font-weight="600" fill="#04342C">② LLM (두뇌)</text>
  <text x="78" y="255" font-size="12" fill="#0F6E56">Ollama qwen2.5</text>
  <text x="78" y="272" font-size="12" fill="#0F6E56">어떤 도구 쓸지 판단</text>

  <!-- Client -->
  <rect x="60" y="310" width="260" height="76" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.2"/>
  <text x="78" y="336" font-size="14" font-weight="600" fill="#26215C">③ MCP Client</text>
  <text x="78" y="355" font-size="12" fill="#534AB7">MultiServerMCPClient</text>
  <text x="78" y="372" font-size="12" fill="#534AB7">(Host 안의 부품)</text>

  <!-- internal arrows -->
  <line x1="190" y1="182" x2="190" y2="209" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="282" x2="190" y2="309" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Server container ===== -->
  <rect x="380" y="64" width="260" height="372" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="398" y="92" font-size="15" font-weight="600" fill="#1E293B">MCP Server</text>
  <text x="398" y="110" font-size="12" fill="#64748B">mcp_server.py</text>

  <!-- Tools -->
  <rect x="400" y="130" width="220" height="84" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1.2"/>
  <text x="418" y="156" font-size="14" font-weight="600" fill="#4A1B0C">Tools · 도구</text>
  <text x="418" y="176" font-size="12" fill="#993C1D">add · get_weather</text>
  <text x="418" y="193" font-size="12" fill="#993C1D">convert_temp · add_city</text>

  <!-- Resources -->
  <rect x="400" y="228" width="220" height="72" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1.2"/>
  <text x="418" y="256" font-size="14" font-weight="600" fill="#4A1B0C">Resources · 리소스</text>
  <text x="418" y="277" font-size="12" fill="#993C1D">cities · count (읽기)</text>

  <!-- Prompts -->
  <rect x="400" y="314" width="220" height="72" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1.2"/>
  <text x="418" y="342" font-size="14" font-weight="600" fill="#4A1B0C">Prompts · 프롬프트</text>
  <text x="418" y="363" font-size="12" fill="#993C1D">weather_report · compare</text>

  <!-- Client <-> Server -->
  <line x1="320" y1="348" x2="380" y2="348" stroke="#0D9488" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="350" y="340" font-size="12" fill="#0D9488" text-anchor="middle">JSON-RPC</text>
  <text x="350" y="366" font-size="12" fill="#64748B" text-anchor="middle">(stdio)</text>

  <!-- legend -->
  <rect x="70" y="452" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="88" y="462" font-size="12" fill="#64748B">사용자</text>
  <rect x="176" y="452" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="194" y="462" font-size="12" fill="#64748B">LLM</text>
  <rect x="270" y="452" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#AFA9EC"/>
  <text x="288" y="462" font-size="12" fill="#64748B">Host · Client (내 앱)</text>
  <rect x="470" y="452" width="12" height="12" rx="3" fill="#FAECE7" stroke="#F0997B"/>
  <text x="488" y="462" font-size="12" fill="#64748B">Server 기능</text>

  <!-- flow caption -->
  <text x="340" y="488" font-size="12" fill="#475569" text-anchor="middle">흐름: 질문 → LLM이 도구 선택 → Client가 Server 호출(tools/call) → 결과 → LLM이 최종 답변</text>
</svg>
